name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJ: DriveDistance/DD-repo-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        id: sdk
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v4
        id: gr
        continue-on-error: true
        with:
          gradle-version: 8.7
      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Publish log and APK
        if: always()
        run: |
          mkdir /tmp/l
          cp "$GITHUB_WORKSPACE/$PROJ/app/build/outputs/apk/debug/app-debug.apk" /tmp/l/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" /tmp/l/ 2>/dev/null || echo "no build.log produced" > /tmp/l/build.log
          {
            echo "java=${{ steps.java.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "gradle_setup=${{ steps.gr.outcome }}"
            echo "build=${{ steps.build.outcome }}"
          } > /tmp/l/status.txt
          cd /tmp/l
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b build-logs
          git add .
          git commit -qm "build log and apk"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: DriveDistance-apk
          path: DriveDistance/DD-repo-root/app/build/outputs/apk/debug/app-debug.apk
